<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Serra ☕❤️</title>

<style>

body{
margin:0;
height:100vh;
background:#ffe5ef;
display:flex;
align-items:center;
justify-content:center;
font-family:"Comic Sans MS",cursive;
overflow:hidden;
}


.container{
text-align:center;
z-index:2;
}


h1{
color:#ff4d88;
font-size:40px;
}


.cat{
width:280px;
animation:dance .7s infinite alternate;
}


@keyframes dance{

from{
transform:rotate(-10deg) translateY(0);
}

to{
transform:rotate(10deg) translateY(-20px);
}

}


button{

font-size:22px;
padding:12px 30px;
margin:10px;
border:none;
border-radius:25px;
cursor:pointer;

}


#yes{
background:#4caf50;
color:white;
}


#no{
background:#ff6b81;
color:white;
transition:.3s;
}


.heart{

position:absolute;
color:#ff8fb1;
opacity:.3;
font-size:40px;
animation:up 8s infinite;

}


@keyframes up{

from{
transform:translateY(100vh);
}

to{
transform:translateY(-20vh);
}

}

</style>

</head>


<body>


<div class="heart" style="left:10%">❤️</div>
<div class="heart" style="left:50%;animation-delay:2s">💕</div>
<div class="heart" style="left:80%;animation-delay:4s">❤️</div>


<div class="container">


<img class="cat"
src="https://media.giphy.com/media/JIX9t2j0ZTN9S/giphy.gif">


<h1 id="question">
Serra kahve içelim mi? ☕💖
</h1>


<button id="yes">
Evet
</button>


<button id="no">
Hayır
</button>


</div>



<script>


const no=document.getElementById("no");
const yes=document.getElementById("yes");
const question=document.getElementById("question");


let count=0;
let size=22;


no.onclick=function(){


count++;

size+=12;

no.style.fontSize=size+"px";


if(count==3){

question.innerHTML=
"Sana bir şans daha verebilir miyim Serra? 💕";

no.innerHTML="Hayır 😢";

}


if(count>=5){

no.style.display="none";

question.innerHTML=
"Lütfen bir şans ver ❤️";

}


};



yes.onclick=function(){

window.location.href="love.html";

};


</script>


</body>
</html>
